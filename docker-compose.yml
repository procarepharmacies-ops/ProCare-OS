# ProCare OS — the one and only stack file.
#
#   docker compose up -d --build
#   open http://localhost:3000           (UI)
#
# Brings up the whole system together: SQL Server (ProCare's own database),
# the FastAPI backend (which mirrors live eStock into that database on a timer),
# and the Next.js UI.
#
# Networking: all three services share one bridge network. The browser only ever
# talks to the frontend on port 3000; the frontend proxies /api to backend:8000
# server-side, and the backend reaches the database at sqlserver:1433 by name.
# The API is also published on host port 7000 (host 7000 -> container 8000) for
# direct access/tools — so host port 8000 stays free for an NVR/camera.
#
# To use the Arabic assistant with Claude, export ANTHROPIC_API_KEY first (optional).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: procare-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "ProCareAdmin#Strong2024"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - procare-net
    restart: always

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: procare-backend
    ports:
      - "7000:8000"            # host 7000 -> container 8000 (host 8000 left free)
    environment:
      PROCARE_DB_SERVER: "sqlserver"
      PROCARE_DB_PORT: "1433"
      PROCARE_DB_DATABASE: "procare_db"
      PROCARE_DB_USER: "sa"
      PROCARE_DB_PASSWORD: "ProCareAdmin#Strong2024"
      # Multi-branch eStock sync: Elsanta (remote) + Mas-hala (local PC)
      # Each branch server is independent; their data stays separate in ProCare.
      # Elsanta: store_id 1 = pharmacy, store_id 2 = depot (both map to ELSANTA).
      ESTOCK_DB_SERVER: "196.202.93.37"
      ESTOCK_DB_PORT: "1433"
      ESTOCK_DB_DATABASE: "stock"
      ESTOCK_DB_USER: "${ESTOCK_DB_USER:-}"
      ESTOCK_DB_PASSWORD: "${ESTOCK_DB_PASSWORD:-}"
      ESTOCK_STORE_BRANCH_MAP: '{"1":"ELSANTA","2":"ELSANTA"}'
      # Mas-hala (local PC on the LAN): store_id 1 = pharmacy only.
      ESTOCK2_DB_SERVER: "${ESTOCK2_DB_SERVER:-}"
      ESTOCK2_DB_PORT: "${ESTOCK2_DB_PORT:-1433}"
      ESTOCK2_DB_DATABASE: "${ESTOCK2_DB_DATABASE:-stock}"
      ESTOCK2_DB_USER: "${ESTOCK2_DB_USER:-}"
      ESTOCK2_DB_PASSWORD: "${ESTOCK2_DB_PASSWORD:-}"
      ESTOCK2_STORE_BRANCH_MAP: '{"1":"MASHALA"}'
      SYNC_ENABLED: "true"
      SYNC_INTERVAL_SECONDS: "300"
      DEFAULT_LANGUAGE: "ar"
      DEFAULT_THEME: "light"
      PROCARE_CORS_ORIGINS: "*"
      # Arabic AI assistant. Both defaults are FREE tiers:
      #   gemini  (default) — Gemini Pro free tier, needs GEMINI_API_KEY
      #   hermes            — Nous Hermes free models via OpenRouter, needs
      #                       OPENROUTER_API_KEY (same key the branch PCs'
      #                       Hermes Agent uses). Set AI_PROVIDER=hermes.
      #   anthropic         — Claude API, needs ANTHROPIC_API_KEY
      #   ollama            — local server, no key; set AI_BASE_URL to its host
      #   claude-cli        — local Claude Code, no key
      # Leave AI_MODEL empty to take the provider's free-tier default. With no
      # key at all the assistant falls back to the offline keyword router.
      AI_PROVIDER: "${AI_PROVIDER:-gemini}"
      AI_MODEL: "${AI_MODEL:-}"
      # Extra comma-separated models tried when the primary is rate-limited or
      # retired. hermes already carries built-in :free fallbacks.
      AI_MODEL_FALLBACKS: "${AI_MODEL_FALLBACKS:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # CEO/manager/assistant login gate on the financial + salary endpoints
      # (accounting, employees). The frontend always requires login regardless
      # of this flag; this is backend defense-in-depth. Set AUTH_SECRET in .env
      # (never committed) — without it a dev-only fallback key is used, which
      # is NOT safe for production.
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_SECRET: "${AUTH_SECRET:-}"
    depends_on:
      - sqlserver
    networks:
      - procare-net
    restart: always

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: procare-frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side proxy target for /api/* (Next.js rewrite). The browser only
      # ever talks to the frontend's own origin.
      BACKEND_INTERNAL: "http://backend:8000"
    depends_on:
      - backend
    networks:
      - procare-net
    restart: always

  # Cloudflare Tunnel — secure access from anywhere on the internet, no port
  # forwarding. Included only when TUNNEL_TOKEN is set in .env (the control
  # script adds --profile tunnel automatically). Get the token from
  # Cloudflare Zero Trust -> Networks -> Tunnels -> your tunnel -> token,
  # and set the tunnel's public hostname service to  http://frontend:3000
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: procare-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - frontend
    networks:
      - procare-net
    restart: always

volumes:
  sqlserver_data:

networks:
  procare-net:
    driver: bridge
